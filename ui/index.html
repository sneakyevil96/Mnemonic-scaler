<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mnemonic Scaler</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="game.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body data-phase="start">
    <div id="backdrop" aria-hidden="true">
      <span class="blob blob-aqua"></span>
      <span class="blob blob-azure"></span>
      <span class="blob blob-coral"></span>
      <span class="blob blob-gold"></span>
    </div>

    <svg class="svg-defs" width="0" height="0" aria-hidden="true">
      <filter id="glass-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.014 0.02" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <header id="titlebar" data-tauri-drag-region>
      <span class="app-name" data-tauri-drag-region>Mnemonic Scaler</span>
      <div id="window-controls">
        <button id="minimize-button" type="button" aria-label="Minimize">&#x2013;</button>
        <button id="close-button" type="button" aria-label="Close">&#x2715;</button>
      </div>
    </header>

    <section id="stats" aria-label="Session stats">
      <div class="stat"><span class="stat-value" id="stat-score">0 / 0</span><span class="stat-label">Correct</span></div>
      <div class="stat"><span class="stat-value" id="stat-rounds">0</span><span class="stat-label">Rounds</span></div>
      <div class="stat"><span class="stat-value" id="stat-streak">0</span><span class="stat-label">Streak</span></div>
      <div class="stat"><span class="stat-value" id="stat-best">0</span><span class="stat-label">Best</span></div>
      <div class="stat"><span class="stat-value" id="stat-accuracy">&#x2014;</span><span class="stat-label">Accuracy</span></div>
    </section>

    <main id="screen"></main>
  </body>
</html>
